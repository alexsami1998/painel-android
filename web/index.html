<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07090e">
<title>Painel</title>
<script>try{document.documentElement.dataset.tema=localStorage.getItem('tema')||'escuro'}catch(e){}</script>
<style>
:root{--bg:#07090e;--card:#10131c;--card2:#161a26;--linha:#1f2433;--txt:#eef1f7;--sub:#8b93a7;--fraco:#5b6275;
  --verde:#2dc653;--azul:#63a7ff;--alerta:#ffb020;--perigo:#ff5d5d;--roxo:#a78bfa;--raio:16px;--topo:48px;
  --sobre-verde:#00160a;--veu:#000a;--g-zap:#10231a;color-scheme:dark}
:root[data-tema="claro"]{--bg:#f3f5f9;--card:#fff;--card2:#eef1f6;--linha:#dde2ec;--txt:#131722;--sub:#5a6275;--fraco:#8a91a3;
  --verde:#1d9a43;--azul:#2f6fd6;--alerta:#b7791f;--perigo:#d93a3a;--roxo:#7c5cd6;--sobre-verde:#fff;--veu:#0006;--g-zap:#e5f6ea;color-scheme:light}
.trocando-tema *,.trocando-tema{transition:background-color .35s,border-color .35s,color .35s!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#topo{position:fixed;top:0;left:0;right:0;height:var(--topo);display:flex;align-items:center;gap:10px;padding:0 14px 0 calc(14px + env(safe-area-inset-left));z-index:5}
#topo .pagina{font-weight:700;font-size:15px;min-width:118px}
#pontos{display:flex;gap:6px;align-items:center}
#pontos i{width:7px;height:7px;border-radius:50%;background:var(--linha);transition:width .2s,background .2s}
#pontos i.on{width:20px;border-radius:4px;background:var(--verde)}
#fixos{margin-left:auto;display:flex;gap:8px;align-items:center;overflow:hidden}
.chip{display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:99px;background:var(--card);border:1px solid var(--linha);white-space:nowrap;font-size:13px}
.chip svg{width:15px;height:15px;flex:0 0 auto}
.chip b{font-size:15px}
.chip.relogio{background:none;border:0;padding:0 2px}
.chip.relogio b{font-size:22px}
#trilho{position:fixed;top:var(--topo);left:0;right:0;bottom:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
#trilho::-webkit-scrollbar{display:none}
.pag{flex:0 0 100vw;min-width:0;height:100%;scroll-snap-align:start;padding:2px 12px calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:flex;gap:10px}
.pag:empty::after{content:"Página vazia. Segure aqui para adicionar um indicador.";margin:auto;color:var(--fraco)}
.w{flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:12px 14px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.w.largo{flex:2.2 1 0}
.w h3{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.w h3 svg{width:14px;height:14px}
.w .corpo{flex:1;display:flex;flex-direction:column;min-height:0}
.w.segurando{transform:scale(.98);border-color:var(--azul);transition:transform .15s}
.anel{display:flex;align-items:center;gap:14px;flex:1;min-height:0}
.anel svg.g{flex:0 1 auto;height:100%;max-height:150px;min-width:0;aspect-ratio:1}
.anel .info{display:flex;flex-direction:column;gap:7px;flex:0 0 auto;white-space:nowrap}
.dado{display:flex;flex-direction:column}
.anel.coluna{flex-direction:column;justify-content:center;gap:8px}
.anel.coluna svg.g{max-height:none;flex:1 1 0;min-height:0}
.anel.coluna .info{flex-direction:row;gap:22px;justify-content:center}
.dado small{color:var(--sub);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.dado b{font-size:17px}
.grande{font-size:46px;font-weight:700;line-height:1}
.medio{font-size:26px;font-weight:700;line-height:1.05}
.sub{color:var(--sub)}
.bom{color:var(--verde)}.ruim{color:var(--perigo)}.atencao{color:var(--alerta)}
.spark{width:100%;height:46px;margin-top:auto;display:block}
.barras{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.barra-l{display:grid;grid-template-columns:96px 1fr 62px;gap:8px;align-items:center;font-size:12px}
.barra-l .trilha{height:7px;background:var(--card2);border-radius:4px;overflow:hidden}
.barra-l .trilha i{display:block;height:100%;border-radius:4px}
.barra-l span:last-child{text-align:right;color:var(--sub)}
.servicos{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px;flex:1;min-height:0}
.srv{background:var(--card2);border-radius:12px;padding:8px 11px;display:flex;flex-direction:column;justify-content:space-between;border-left:4px solid var(--fraco);min-height:0}
.srv.ok{border-left-color:var(--verde)}.srv.parado{border-left-color:var(--perigo)}.srv.meio{border-left-color:var(--alerta)}
.srv b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv .met{display:flex;gap:10px;font-size:12px;color:var(--sub);white-space:nowrap}
.srv .met span b{font-size:12px;color:var(--txt)}
.lista{display:flex;flex-direction:column;gap:6px;overflow:hidden;flex:1}
.item{display:flex;gap:10px;align-items:center;padding:7px 9px;background:var(--card2);border-radius:10px;min-height:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .h{font-size:12px;color:var(--fraco);white-space:nowrap}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:6px;flex:1;min-height:0}
.foto{position:relative;background:#000;border-radius:9px;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto span{position:absolute;left:5px;bottom:5px;background:#000b;font-size:11px;padding:1px 6px;border-radius:5px}
.destaque{position:relative;flex:1;min-height:0;border-radius:11px;overflow:hidden;background:#000}
.destaque img{width:100%;height:100%;object-fit:cover}
.sem-sinal{position:absolute;inset:0;display:grid;place-items:center;color:var(--fraco);font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:repeating-linear-gradient(45deg,#0000 0 10px,#ffffff06 10px 20px)}
.destaque .rot{position:absolute;left:8px;bottom:8px;right:8px;display:flex;justify-content:space-between;align-items:end;text-shadow:0 1px 3px #000}
.cta{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--sub);max-width:320px}
.btn{background:var(--verde);color:var(--sobre-verde);border:0;border-radius:11px;padding:10px 16px;font:600 14px system-ui;cursor:pointer}
.btn.s{background:var(--card2);color:var(--txt);border:1px solid var(--linha)}
#folha{position:fixed;inset:0;background:var(--veu);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#folha .caixa{background:var(--card);border:1px solid var(--linha);border-radius:18px 18px 0 0;width:min(620px,100%);padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:96vh;overflow:auto}
#folha h4{margin:0 0 10px;font-size:16px}
#folha .opcoes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
#folha .opcoes button{background:var(--card2);color:var(--txt);border:1px solid var(--linha);border-radius:10px;padding:9px 13px;font:14px system-ui}
#folha .opcoes button.atual{border-color:var(--verde);color:var(--verde)}
#folha small{display:block;color:var(--sub);margin:4px 0 6px;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
#login{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center}
#login form{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:20px;width:320px}
#login input{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--linha);border-radius:10px;padding:10px;margin:10px 0;font:15px system-ui;-webkit-user-select:text;user-select:text}
#login .erro{color:var(--perigo);font-size:13px;min-height:18px}
.w.dinamico{flex:0 0 0;min-width:0;padding:0;border-width:0;opacity:0;transition:flex-basis .45s cubic-bezier(.2,.8,.2,1),opacity .3s,padding .45s,border-width .45s}
.w.dinamico.dentro{flex:0 0 40%;padding:12px 14px;border-width:1px;opacity:1}
.w{transition:flex-basis .45s cubic-bezier(.2,.8,.2,1),flex-grow .45s,opacity .3s,padding .45s}
.w.recolhido{flex:0 0 0;min-width:0;padding:0;border-width:0;opacity:0;margin-left:-10px}
#ajustes-btn{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--linha);background:var(--card);color:var(--sub);display:grid;place-items:center;padding:0}
#ajustes-btn svg{width:17px;height:17px}
#folha .campo{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
#folha input[type=number]{width:90px;background:var(--card2);color:var(--txt);border:1px solid var(--linha);border-radius:10px;padding:8px;font:15px system-ui;-webkit-user-select:text;user-select:text}
#folha .liga{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--linha)}
#folha .liga input{width:22px;height:22px;accent-color:var(--verde)}
.w.dinamico.zap{border-color:#2dc65366;background:linear-gradient(160deg,var(--g-zap),var(--card) 55%)}
.w.dinamico .cab{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.w.dinamico .cab svg{width:16px;height:16px}
.w.dinamico .quem{font-size:22px;font-weight:700;margin:8px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w.dinamico .autor{font-size:13px;color:var(--verde);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w.dinamico .texto{font-size:19px;line-height:1.35;margin-top:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;word-break:break-word}
.w.dinamico .tempo{position:absolute;left:0;bottom:0;height:3px;background:var(--verde);animation:tempo linear forwards}
@keyframes tempo{from{width:100%}to{width:0}}
@keyframes troca{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#pontos i{transition:none}.w.dinamico{transition:opacity .2s}}
@media (orientation:portrait){.pag{flex-direction:column;overflow-y:auto}.w{min-height:240px;flex:none}}
.chip[data-w^="mini_whatsapp"],.chip[data-w^="mini_business"],[data-w="whatsapp"],[data-w="whatsapp_business"]{cursor:pointer}
#hist{position:fixed;inset:0;z-index:40;background:var(--veu);display:flex;align-items:center;justify-content:center;padding:10px calc(10px + env(safe-area-inset-left));opacity:0;transition:opacity .22s}
#hist.dentro{opacity:1}
.h-caixa{background:var(--card);border:1px solid var(--linha);border-radius:18px;width:100%;height:100%;max-width:980px;display:flex;flex-direction:column;overflow:hidden;transform:translateY(14px) scale(.98);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
#hist.dentro .h-caixa{transform:none}
.h-topo{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--linha)}
.h-apps{display:flex;gap:4px;background:var(--card2);border-radius:11px;padding:3px}
.h-apps button{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--sub);font:600 13px system-ui;padding:6px 11px;border-radius:8px;transition:background-color .2s,color .2s}
.h-apps button svg{width:15px;height:15px}
.h-apps button[aria-selected="true"]{background:var(--card);color:var(--verde);box-shadow:0 1px 3px #0003}
.h-nota{font-size:12px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-fechar{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--linha);background:var(--card2);color:var(--txt);font-size:14px}
.h-corpo{flex:1;display:flex;min-height:0}
.h-lista{flex:0 0 250px;overflow-y:auto;border-right:1px solid var(--linha);padding:6px;display:flex;flex-direction:column;gap:3px}
.h-conv{display:grid;grid-template-columns:1fr auto;column-gap:6px;text-align:left;border:0;background:none;color:var(--txt);border-radius:10px;padding:7px 9px;font:inherit;transition:background-color .15s}
.h-conv b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-conv small{grid-row:1;grid-column:2;font-size:11px;color:var(--fraco);white-space:nowrap}
.h-conv span{grid-column:1/3;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-conv.on{background:color-mix(in srgb,var(--verde) 13%,var(--card2))}
.h-chat{flex:1;min-width:0;display:flex;flex-direction:column}
.h-cab{display:flex;align-items:baseline;gap:10px;padding:9px 14px;border-bottom:1px solid var(--linha);white-space:nowrap;overflow:hidden}
.h-cab b{font-size:15px;overflow:hidden;text-overflow:ellipsis}
.h-cab .sub{font-size:12px}
.h-msgs{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:5px;-webkit-user-select:text;user-select:text;overscroll-behavior:contain}
.h-msgs.troca{animation:troca .3s cubic-bezier(.2,.8,.2,1)}
.h-dia{align-self:center;font-size:11px;color:var(--sub);background:var(--card2);border-radius:99px;padding:2px 10px;margin:6px 0 2px}
.h-msg{align-self:flex-start;max-width:78%;background:var(--card2);border-radius:4px 13px 13px 13px;padding:6px 10px 4px;display:flex;flex-direction:column}
.h-msg.meu{align-self:flex-end;background:color-mix(in srgb,var(--verde) 18%,var(--card2));border-radius:13px 4px 13px 13px}
.h-msg b{font-size:12px;color:var(--azul)}
.h-msg p{margin:0;font-size:14px;line-height:1.38;white-space:pre-wrap;word-break:break-word}
.h-msg time{align-self:flex-end;font-size:10.5px;color:var(--fraco);margin-top:1px}
.h-lista::-webkit-scrollbar,.h-msgs::-webkit-scrollbar{width:4px}.h-lista::-webkit-scrollbar-thumb,.h-msgs::-webkit-scrollbar-thumb{background:var(--linha);border-radius:4px}
@media (prefers-reduced-motion:reduce){#hist,.h-caixa{transition:none}.h-msgs.troca{animation:none}}
</style>
</head>
<body>
<div id="topo"><div class="pagina" id="nome-pagina">Painel</div><div id="pontos"></div><div id="fixos"></div><button id="ajustes-btn" aria-label="Ajustes"></button></div>
<div id="trilho"></div>
<div id="folha" hidden></div>
<div id="hist" hidden></div>
<div id="login" hidden><form id="login-form"><b id="login-tit">Painel</b><input type="password" id="login-senha" placeholder="Senha" required><div class="erro" id="login-erro"></div><button class="btn" style="width:100%">Entrar</button></form></div>
<script src="widgets.js"></script>
<script src="historico.js"></script>
<script src="app.js"></script>
</body>
</html>
